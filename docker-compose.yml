name: rsc-bot

# 日志轮转：collector 每分钟一条 tick，不限的话 json-file 会一直涨。
# 上 A6000 前用 `docker inspect` 看过，原来没有任何 max-size。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  web:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.12-slim}
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
        PIP_INDEX: ${PIP_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: rsc-bot:latest
    # 强制本地构建，避免 compose 去 Docker Hub 拉取不存在的 rsc-bot 镜像
    pull_policy: build
    container_name: rsc-web
    restart: unless-stopped
    logging: *default-logging
    ports:
      # 左边是宿主机端口：0.0.0.0:8001 -> 局域网可访问
      - "0.0.0.0:8001:8001"
    environment:
      TZ: Asia/Shanghai
      RSC_DB: /app/data/market.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  collector:
    image: rsc-bot:latest
    # 复用 web 构建出的本地镜像，不做远程拉取
    pull_policy: never
    container_name: rsc-collector
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      RSC_DB: /app/data/market.db
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "rscbot.collector", "--minutes", "0"]
    healthcheck:
      disable: true

networks:
  default:
    name: rsc-bot-net
