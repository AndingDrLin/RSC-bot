# 策略与运行配置样例（M1 起由 pydantic-settings 加载，环境变量可覆盖）
# 铁律：任何进入实盘的参数必须在这里有记录；不允许在代码里硬编码。

mode: paper              # paper | shadow | live  (live 还需 .env 的 LIVE_ENABLED=true 双开关)

universe:
  mode: explicit         # explicit | filter
  include:
    - FX:JPY
    - FX:EUR
    - CRYPTO:BTC/USD
    - CRYPTO:ETH/USD
    - NASDAQ:NVDA
    - HKEX:0700
  filter:                # mode=filter 时生效
    min_popularity: 10
    exclude_delayed: true          # 排除 15 分钟延迟品种
    exclude_close_only: true
    max_per_exchange: 20

schedule:
  tick_seconds: 60
  order_tracking_seconds: 3
  order_tracking_timeout_seconds: 60
  timezone: UTC

strategies:
  - name: trend_fx
    family: trend
    enabled: true
    params:
      lookbacks: [3, 6, 12, 24]
      vol_window: 72
      entry_z: 1.5
      exit_z: 0.5
      atr_stop_mult: 2.0
      max_hold_bars: 48
    instruments: [FX:JPY, FX:EUR, FX:GBP, FX:CHF]
    risk_budget_pct: 0.3     # 占总风险预算比例

  - name: trend_crypto
    family: trend
    enabled: true
    params:
      lookbacks: [6, 12, 24, 48]
      vol_window: 96
      entry_z: 1.8
      exit_z: 0.6
      atr_stop_mult: 2.5
      max_hold_bars: 72
    instruments: [CRYPTO:BTC/USD, CRYPTO:ETH/USD]
    risk_budget_pct: 0.2

  - name: xsec_reversion_us
    family: xsec_meanrev
    enabled: false           # M5 验收后再开
    params:
      lookback_days: 5
      group_by: industry
      quantile: 0.2
      holding_days: 4
    universe_group: us
    risk_budget_pct: 0.3

  - name: pairs_dual_listing
    family: pairs
    enabled: false
    params:
      coint_pvalue: 0.05
      lookback_days: 60
      entry_z: 2.0
      exit_z: 0.5
      stop_z: 3.5
    pairs:
      - [EURONEXT:ASML, AMS:ASML]
      - [AMEX:GLD, INDEX:SPX]
    risk_budget_pct: 0.2

portfolio:
  target_annual_vol: 0.10
  max_gross_leverage: 3.0
  max_symbol_weight: 0.25
  max_exchange_weight: 0.60
  vol_lookback_days: 20
  rebalance_threshold_pct: 0.05

risk:
  max_daily_loss_pct: 5.0
  max_weekly_loss_pct: 10.0
  max_consecutive_losses: 5
  max_positions: 12
  high_risk_budget_ratio: 0.25
  per_trade_risk_pct: 0.3
  stop_after_drawdown_pct: 15.0
  cooldown_minutes: 60

execution:
  order_type: market
  max_orders_per_minute: 30
  max_slippage_bps: 20
  fill_timeout_seconds: 60
  retry_attempts: 2
  retry_backoff_seconds: [1, 3]
  split_order_notional_rsc: 50   # 大单拆分阈值

budget:
  p0_order: 6
  p1_tracking: 8
  p2_hot_quote: 10
  p3_universe: 4
  p4_backfill: 2

obs:
  log_level: INFO
  prometheus_port: 9101
  audit_dir: /data/state/audit
  alert_channels: [telegram]      # telegram | email | none
